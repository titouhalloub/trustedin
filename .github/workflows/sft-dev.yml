name: SFT-Dev validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/p2p-first-messaging-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sft-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SFT-Dev (typecheck, lint, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run project SFT-Dev tester
        run: npm run sft-dev
        env:
          # Build-only placeholders: CI validates compilation without production credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
